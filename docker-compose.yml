services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaveflow-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - leaveflow

  nginx:
    image: nginx:alpine
    container_name: leaveflow-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - leaveflow

  mysql:
    image: mysql:8.0
    container_name: leaveflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: leaveflow
      MYSQL_USER: leaveflow
      MYSQL_PASSWORD: leaveflow_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - leaveflow_mysql_data:/var/lib/mysql
    networks:
      - leaveflow

  node:
    image: node:22-alpine
    container_name: leaveflow-node
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - leaveflow_node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    networks:
      - leaveflow

networks:
  leaveflow:
    driver: bridge

volumes:
  leaveflow_mysql_data:
  leaveflow_node_modules: